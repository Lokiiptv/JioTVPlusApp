name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 35
          sdk-build-tools: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/jiotvplus-debug.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -alias jiotvplus \
            -storepass jiotvplus123 \
            -keypass jiotvplus123 \
            -validity 10000 \
            -dname "CN=JioTVPlus, OU=Debug, O=JioTV, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/jiotvplus-release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -alias jiotvplus \
            -storepass jiotvplus123 \
            -keypass jiotvplus123 \
            -validity 10000 \
            -dname "CN=JioTVPlus, OU=Release, O=JioTV, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiotvplus-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## JioTVPlus Release

            ### Download
            Install via ADB: `adb install jiotvplus-release.apk`

            ### Features
            - Live TV streaming (HLS + DASH)
            - Channel grid with genre filters
            - Voice + text search
            - Recently played + Play Next
            - Token auto-refresh
            - Screen keep-on during playback
            - Works on Android TV + phones
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
